name: Bug report
description: 报告 Skill 触发、仓库读取、事实边界、输出或校验问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        不要粘贴私人简历全文、公司内部仓库、客户数据、密钥或未公开日志。能公开复现时，请固定仓库 commit。
  - type: dropdown
    id: area
    attributes:
      label: 问题范围
      options:
        - Skill 触发
        - Repository Map / 行为链路
        - 故事选择与去重
        - Claim / 指标 / 个人归属
        - 成稿格式
        - 安装
        - CI / 校验器
        - 文档
    validations:
      required: true
  - type: input
    id: skill_revision
    attributes:
      label: project-to-resume revision
      description: 使用的 tag、branch 或 40 位 commit。
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: 宿主 Agent 与版本
      placeholder: Codex / Claude Code / Cursor / 其他
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: 可公开的复现仓库与 commit
      description: 无法公开时请留空，不要提交内部地址。
  - type: textarea
    id: request
    attributes:
      label: 最小复现请求
      render: text
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除私人简历、联系方式、内部代码、客户数据和密钥。
          required: true
