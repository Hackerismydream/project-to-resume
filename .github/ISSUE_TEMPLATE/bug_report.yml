name: Bug report
description: Report a reproducible installation, validation, routing, or output-contract problem
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not paste private resumes, credentials, internal repository content, customer data, or exploitable security details. Security issues must follow SECURITY.md.

  - type: input
    id: skill_commit
    attributes:
      label: project-to-resume commit
      description: Use a full 40-character commit when possible.
      placeholder: 0123456789abcdef0123456789abcdef01234567
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Skill invocation or routing
        - Repository discovery
        - Story selection or duplication
        - Claim or metric boundary
        - Resume output format
        - Installation
        - CI or deterministic validation
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Host Agent, model, operating system, and relevant permissions. Redact sensitive values.
      placeholder: |
        Host Agent/version:
        Model/config:
        OS:
        Repository access:
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use a public repository and fixed commit, or a fully synthetic fixture.
      placeholder: |
        1. Install...
        2. Open public repository at commit...
        3. Run prompt...
        4. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Public evidence anchors
      description: Optional fixed-commit source/test links. State what each anchor does and does not prove.

  - type: checkboxes
    id: privacy
    attributes:
      label: Safety check
      options:
        - label: I removed private resumes, credentials, internal code, customer data, and personal information.
          required: true
        - label: This is not an undisclosed security vulnerability.
          required: true
