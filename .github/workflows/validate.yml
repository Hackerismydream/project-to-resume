name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Compile validators
        run: python3 -m py_compile scripts/*.py tests/*.py

      - name: Lint copy-ready examples
        run: python3 scripts/lint_examples.py examples/*.md

      - name: Validate package contracts
        run: python3 scripts/validate_package.py

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Smoke install isolated package
        run: python3 scripts/smoke_install.py --source .

      - name: Check dependency consistency
        run: python3 -m pip check

      - name: Check whitespace errors in the submitted diff
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          if os.environ["EVENT_NAME"] == "pull_request":
              base = event["pull_request"]["base"]["sha"]
          else:
              before = event.get("before", "")
              if before and set(before) != {"0"}:
                  base = before
              else:
                  base = subprocess.check_output(
                      ["git", "rev-parse", "HEAD^"], text=True
                  ).strip()

          subprocess.run(["git", "diff", "--check", base, "HEAD"], check=True)
          PY
