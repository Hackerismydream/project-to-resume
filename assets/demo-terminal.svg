<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Project to Resume terminal demo</title>
  <desc id="desc">A macOS-style terminal showing Project to Resume turning repository evidence into current and metric-enhanced resume versions.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#111827"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="titlebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#252b36"/>
      <stop offset="1" stop-color="#1a1f29"/>
    </linearGradient>
    <linearGradient id="currentCard" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d211b"/>
      <stop offset="1" stop-color="#101a20"/>
    </linearGradient>
    <linearGradient id="targetCard" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#171b39"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="30" stdDeviation="35" flood-color="#020617" flood-opacity="0.65"/>
    </filter>
    <style>
      .mono { font-family: Menlo, Monaco, "SFMono-Regular", "PingFang SC", "Microsoft YaHei", monospace; }
      .ui { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1350" cy="120" r="360" fill="url(#glow)"/>
  <circle cx="180" cy="780" r="300" fill="url(#glow)" opacity="0.55"/>

  <g filter="url(#shadow)">
    <rect x="90" y="70" width="1420" height="760" rx="25" fill="#0b0f17" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
    <path d="M115 70h1370a25 25 0 0 1 25 25v65H90V95a25 25 0 0 1 25-25z" fill="url(#titlebar)"/>
  </g>

  <circle cx="132" cy="115" r="10" fill="#ff5f57"/>
  <circle cx="166" cy="115" r="10" fill="#febc2e"/>
  <circle cx="200" cy="115" r="10" fill="#28c840"/>
  <text x="800" y="124" text-anchor="middle" class="ui" font-size="20" font-weight="600" fill="#d8dee9">project-to-resume — tgo</text>
  <text x="1460" y="122" text-anchor="end" class="mono" font-size="16" fill="#7f8a9a">evidence-first</text>

  <g class="mono" font-size="22">
    <text x="138" y="210" fill="#67e8f9">~/code/tgo</text>
    <text x="300" y="210" fill="#94a3b8">$</text>
    <text x="328" y="210" fill="#f8fafc">使用 $project-to-resume 分析当前仓库，生成中文技术简历</text>

    <text x="138" y="263" fill="#4ade80">✓</text>
    <text x="176" y="263" fill="#cbd5e1">固定证据身份</text>
    <text x="404" y="263" fill="#64748b">995da457… · source-only</text>

    <text x="138" y="306" fill="#4ade80">✓</text>
    <text x="176" y="306" fill="#cbd5e1">建立 Claim Ledger</text>
    <text x="442" y="306" fill="#64748b">5 条证据可用主张</text>

    <text x="138" y="349" fill="#4ade80">✓</text>
    <text x="176" y="349" fill="#cbd5e1">生成两个简历版本</text>
  </g>

  <rect x="132" y="390" width="1336" height="150" rx="16" fill="url(#currentCard)" stroke="#34d399" stroke-opacity="0.34"/>
  <rect x="132" y="390" width="6" height="150" rx="3" fill="#34d399"/>
  <text x="174" y="430" class="ui" font-size="18" font-weight="700" letter-spacing="1.2" fill="#6ee7b7">CURRENT · 当前证据版</text>
  <text x="174" y="474" class="ui" font-size="23" font-weight="600" fill="#f1f5f9">融合关键词与语义候选排序，并保留两路排名元数据；</text>
  <text x="174" y="510" class="ui" font-size="21" fill="#94a3b8">当前证据支持实现行为，但不支持 Recall 提升数字。</text>

  <rect x="132" y="566" width="1336" height="190" rx="16" fill="url(#targetCard)" stroke="#818cf8" stroke-opacity="0.4"/>
  <rect x="132" y="566" width="6" height="190" rx="3" fill="#818cf8"/>
  <text x="174" y="606" class="ui" font-size="18" font-weight="700" letter-spacing="1.2" fill="#a5b4fc">RECOMMENDED · 指标增强版（待实测，不可投递）</text>
  <text x="174" y="650" class="ui" font-size="22" font-weight="600" fill="#f1f5f9">在 [待实测：检索 Case 数] 个 held-out Case 上，</text>
  <text x="174" y="688" class="ui" font-size="22" fill="#c7d2fe">将 Recall@10 从 [待实测：最佳单路] 提升至 [待实测：融合结果]，</text>
  <text x="174" y="724" class="ui" font-size="21" fill="#94a3b8">并附 baseline、workload、成功门槛与原始 artifact。</text>

  <text x="138" y="798" class="mono" font-size="18" fill="#64748b">Evidence first. No invented metrics.</text>
  <rect x="506" y="783" width="11" height="20" rx="2" fill="#67e8f9" opacity="0.9"/>
</svg>
